<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clark Tanquerido | UX/UI Designer</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body class="full-height-page">
    <div class="seven-column-grid">
      <!-- This single container will hold all grid cells for both rows and columns -->
      <div class="grid-background"></div>
      <div class="grid-right-border"></div>

      <!-- Content to be placed on the grid -->
      <p class="grid-content row1-col1-content">DESIGNING</p>
      <p class="grid-content row1-col4-content">IMPACTFUL EXPERIENCES</p>
      <p class="grid-content row1-col5-content">DRIVEN</p>
      <p class="grid-content row1-col7-content">BY</p>
      <p class="grid-content row2-col2-content">USER-RESEARCH</p>
      <p class="grid-content row2-col6-content">AND</p>
      <p class="grid-content row2-col7-content">TRANSLATING</p>
      <p class="grid-content row3-col1-content">CREATIVE VISIONS</p>
      <p class="grid-content row3-col4-content">INTO</p>
      <p class="grid-content row3-col6-content">DIGITAL SOLUTIONS.</p>

    </div>
    <div class="custom-cursor">
      <span class="cursor-text"></span>
    </div>
    <script src="script.js"></script>
  </body>
</html>
